[package]
name = "reap"
version = "0.8.1"
edition = "2024"
rust-version = "1.91"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
# Upgraded reqwest - let it manage TLS internally (no direct ring/rustls deps)
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
# Upgraded ratatui to fix lru unsoundness (RUSTSEC-2026-0002)
ratatui = "0.30"
crossterm = "0.28"
once_cell = "1.19"
dirs = "5"
diff = "0.1"
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
chrono = { version = "0.4", features = ["serde"] }
# REMOVED: ring, rustls, rustls-webpki, sct, webpki, hyper-rustls
# These caused RUSTSEC-2025-0009, RUSTSEC-2025-0010, RUSTSEC-2024-0336
# reqwest 0.12 handles TLS internally with modern versions
futures = "0.3"
regex = "1"
rayon = "1.10.0"
which = "8.0.0"
owo-colors = "4"
# Upgraded indicatif to address number_prefix unmaintained warning
indicatif = "0.18"
async-trait = "0.1"
urlencoding = "2"
fs_extra = "1.3"
mlua = { version = "0.10", features = ["lua54"] }
anyhow = "1.0"
thiserror = "2.0"
roxmltree = "0.20"
fuzzy-matcher = "0.3"
hex = "0.4"
glob = "0.3"
sha2 = "0.11"

[features]
default = []
cache = []

[dev-dependencies]
tempfile = "3"
