services:
  reaper-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    network_mode: host
    volumes:
      - ../:/reaper:ro
      - pacman-cache:/var/cache/pacman
    environment:
      - TERM=xterm-256color
      - HOME=/home/testuser
    stdin_open: true
    tty: true
    working_dir: /home/testuser
    command: /bin/bash

volumes:
  pacman-cache:
